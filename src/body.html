<canvas id="stars" aria-hidden="true"></canvas>
<div id="redflash"></div>
<div id="app">
  <section id="scr-title" class="screen">
    <div class="title-wrap">
      <div class="lang-pick" role="group" data-ta="lang.aria">
        <button class="lang-btn" data-lang="fr" lang="fr">Français</button>
        <button class="lang-btn" data-lang="es" lang="es">Español</button>
      </div>
      <div class="title-lumi" id="titleLumi" aria-hidden="true"></div>
      <p class="kicker" data-t="title.kicker"></p>
      <h1 class="logo">CHRONO<span>·</span>OHM</h1>
      <p class="tag" data-t="title.tag"></p>
      <div class="name-row" id="nameRow" hidden>
        <label for="nameIn" data-t="title.name"></label>
        <input id="nameIn" type="text" maxlength="18" autocomplete="off" data-tp="title.namePh">
      </div>
      <p class="store-warn" id="storeWarn" data-t="save.noStore" hidden></p>
      <button id="btnStart" class="btn primary xl" data-t="btn.play"></button>
      <p class="who-line" id="whoLine" hidden></p>
    </div>
  </section>
  <section id="scr-talk" class="screen" hidden></section>
  <section id="scr-travel" class="screen" hidden></section>
  <section id="scr-hub" class="screen" hidden></section>
  <section id="scr-play" class="screen" hidden>
    <div class="play-head">
      <button id="quitBtn" class="btn sm ghost" data-t="btn.quit"></button>
      <div class="ph-title" id="phTitle"></div>
      <div class="ph-right" id="phRight"></div>
    </div>
    <article id="stage" class="stage" aria-live="polite"></article>
  </section>
</div>
<div class="modal" id="settings" hidden>
  <div class="modal-card panel" role="dialog" aria-modal="true" aria-labelledby="setTitle">
    <h2 id="setTitle" data-t="set.title"></h2>
    <div class="name-row"><label for="setName" data-t="title.name"></label><input id="setName" type="text" maxlength="18"></div>
    <div class="set-lang">
      <span class="set-l" data-t="set.lang"></span>
      <div class="lang-pick small" role="group" data-ta="lang.aria">
        <button class="lang-btn" data-lang="fr" lang="fr">Français</button>
        <button class="lang-btn" data-lang="es" lang="es">Español</button>
      </div>
    </div>
    <div>
      <label class="tg-row" for="tAlt"><span><span data-t="set.alt"></span> <span class="es" data-t="set.altHelp"></span></span><input type="checkbox" id="tAlt"></label>
      <label class="tg-row" for="tNarr"><span><span data-t="set.narr"></span> <span class="es" id="narrHelp" data-t="set.narrHelp"></span></span><input type="checkbox" id="tNarr"></label>
      <div class="set-lang set-voice"><span class="set-l"><span data-t="set.voice"></span> <span class="es" id="voiceHelp"></span></span>
        <div class="lang-pick small" role="group" data-ta="set.voice"><button class="lang-btn" data-voice="rec" data-t="set.voice.rec"></button><button class="lang-btn" data-voice="device" data-t="set.voice.device"></button></div></div>
      <label class="tg-row" for="tMusic"><span data-t="set.music"></span><input type="checkbox" id="tMusic"></label>
      <label class="tg-row" for="tSfx"><span data-t="set.sfx"></span><input type="checkbox" id="tSfx"></label>
    </div>
    <section class="backup" aria-labelledby="offTitle"><h3 id="offTitle"></h3><div id="offBox"></div></section>
    <section class="backup" aria-labelledby="bkTitle">
      <h3 id="bkTitle" data-t="save.title"></h3>
      <p class="save-info" id="saveInfo"></p>
      <p class="small" data-t="save.help"></p>
      <div class="bk-row">
        <button class="btn sm" id="bkCopy" data-t="save.copy"></button>
        <button class="btn sm ghost" id="bkFile" data-t="save.file"></button>
        <button class="btn sm ghost" id="bkRestore" data-t="save.restore"></button>
        <label class="btn sm ghost" for="bkLoad"><span data-t="save.load"></span><input type="file" id="bkLoad" accept=".txt,text/plain" hidden></label>
      </div>
      <textarea id="bkCode" class="bk-code" rows="3" readonly hidden data-ta="save.copy"></textarea>
      <textarea id="bkIn" class="bk-code" rows="3" hidden data-tp="save.pastePh" data-ta="save.restore"></textarea>
      <p class="gmsg" id="bkMsg" aria-live="polite"></p>
    </section>
    <div style="display:flex;gap:10px;flex-wrap:wrap;justify-content:space-between">
      <button class="btn sm ghost danger" id="btnReset" data-t="set.reset"></button>
      <button class="btn primary" id="setClose" data-t="btn.close"></button>
    </div>
  </div>
</div>
<div id="toast" role="status" hidden></div>
<div id="achStack" aria-live="polite"></div>
