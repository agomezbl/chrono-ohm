<script>
(function(){'use strict';
const I18N={"c":{"París, hoy. Noche de los museos. En el Museo de las Ciencias, la última sala sigue abierta.":{"fr":"Paris, aujourd'hui. C'est la Nuit des musées. Au Musée des sciences, la dernière salle est encore ouverte.","es":"París, hoy. Noche de los museos. En el Museo de las Ciencias, la última sala sigue abierta."},"En una vitrina descansa el Gran Libro de la Electricidad: cada página la escribió un sabio que cambió el mundo.":{"fr":"Dans une vitrine repose le Grand Livre de l'Électricité : chaque page a été écrite par un savant qui a changé le monde.","es":"En una vitrina descansa el Gran Libro de la Electricidad: cada página la escribió un sabio que cambió el mundo."},"Buenas noches, joven. Permítame presentarme: Barón Court-Circuit.":{"fr":"Bonsoir. Belle nuit pour visiter un musée, n'est-ce pas ? Permettez-moi de me présenter : Baron Court-Circuit.","es":"Buenas noches. Bonita noche para visitar un museo, ¿verdad? Permítame presentarme: Barón Court-Circuit."},"Este libro guarda todos los descubrimientos eléctricos. Si arranco sus páginas en el pasado… ¡nadie los habrá hecho jamás!":{"fr":"Ce livre renferme toutes les découvertes électriques. Si j'arrache ses pages dans le passé… personne ne les aura jamais faites !","es":"Este libro guarda todos los descubrimientos eléctricos. Si arranco sus páginas en el pasado… ¡nadie los habrá hecho jamás!"},"El mundo volverá a las velas. Y yo seré el único que domine la electricidad. ¡Ja, ja, ja!":{"fr":"Le monde retournera aux bougies. Et je serai le seul à maîtriser l'électricité. Ha, ha, ha !","es":"El mundo volverá a las velas. Y yo seré el único que domine la electricidad. ¡Ja, ja, ja!"},"El Barón salta dentro de un anillo luminoso y desaparece. Las luces del museo parpadean. Los móviles se apagan.":{"fr":"Le Baron saute dans un anneau lumineux et disparaît. Les lumières du musée clignotent. Les téléphones s'éteignent.","es":"El Barón salta dentro de un anillo luminoso y desaparece. Las luces del museo parpadean. Los móviles se apagan."},"¡Bip! ¿Hola? ¡Sistema Lumi activado! Soy la asistente del Chronotron número 2. ¡Ese bandido ha robado el número 1!":{"fr":"Bip ! Allô ? Système Lumi activé ! Je suis l'assistante du Chronotron numéro 2. Ce bandit a volé le numéro 1 !","es":"¡Bip! ¿Hola? ¡Sistema Lumi activado! Soy la asistente del Chronotron número 2. ¡Ese bandido ha robado el número 1!"},"Cada página que arranca borra un descubrimiento. Si no lo detenemos, la «intensité», la «résistance» y la ley de Ohm… desaparecerán.":{"fr":"Chaque page qu'il arrache efface une découverte. Si on ne l'arrête pas, l'[[intensité]], la [[résistance]] et la loi d'Ohm… vont disparaître.","es":"Cada página que arranca borra un descubrimiento. Si no lo detenemos, la [[intensidad]], la [[resistencia]] y la ley de Ohm… desaparecerán."},"Necesito a alguien con buen ojo para los circuitos. ¿{N}? Perfecto. Sube al Chronotron.":{"fr":"J'ai besoin de quelqu'un qui a l'œil pour les circuits. Tu veux bien m'aider, {N} ? Parfait ! Monte dans le Chronotron.","es":"Necesito a alguien con buen ojo para los circuitos. ¿Me ayudas, {N}? ¡Perfecto! Sube al Chronotron."},"Primera parada: París, 1820. Vamos a buscar a André-Marie Ampère. ¡Agárrate fuerte!":{"fr":"Premier arrêt : Paris, 1820. Allons trouver André-Marie Ampère. Accroche-toi bien !","es":"Primera parada: París, 1820. Vamos a buscar a André-Marie Ampère. ¡Agárrate fuerte!"},"Paris":{"fr":"Paris","es":"París"},"París, septiembre de 1820":{"fr":"Paris, septembre 1820","es":"París, septiembre de 1820"},"Le courant":{"fr":"Le courant","es":"La corriente"},"La corriente y la intensidad":{"fr":"Le courant et l'intensité","es":"La corriente y la intensidad"},"Page 1 · L'intensité":{"fr":"Page 1 · L'intensité","es":"Página 1 · La intensidad"},"Premier circuit":{"fr":"Premier circuit","es":"Primer circuito"},"París, septiembre de 1820. Un laboratorio lleno de pilas, brújulas y montañas de papeles.":{"fr":"Paris, septembre 1820. Un laboratoire rempli de piles, de boussoles et de montagnes de papiers.","es":"París, septiembre de 1820. Un laboratorio lleno de pilas, brújulas y montañas de papeles."},"Mon Dieu ! ¿Quiénes sois? ¿Y qué es esa… bombilla con patas?":{"fr":"Mon Dieu ! Qui êtes-vous ? Et qu'est-ce que c'est que cette… ampoule sur pattes ?","es":"¡Mon Dieu! ¿Quiénes sois? ¿Y qué es esa… bombilla con patas?"},"¡Bip! Soy Lumi, y él es {N}, mi ingeniero. Venimos del futuro para ayudarle, monsieur Ampère.":{"fr":"Bip ! Je suis Lumi. Nous venons du futur pour vous aider, monsieur Ampère. N'est-ce pas, {N} ?","es":"¡Bip! Soy Lumi. Venimos del futuro para ayudarle, monsieur Ampère. ¿Verdad, {N}?"},"¿Ayudarme? Un hombre con sombrero de copa entró anoche y se llevó mis notas. Dentro de una semana debo presentar mis experimentos en la Académie des sciences.":{"fr":"M'aider ? Un homme en chapeau haut-de-forme est entré hier soir et a emporté mes notes. Dans une semaine, je dois présenter mes expériences à l'Académie des sciences.","es":"¿Ayudarme? Un hombre con sombrero de copa entró anoche y se llevó mis notas. Dentro de una semana debo presentar mis experimentos en la Académie des sciences."},"Ørsted, un danés, acaba de descubrir que una «courant électrique» mueve la aguja de una brújula. Yo quiero entender esa corriente: medirla, domarla.":{"fr":"Ørsted, un Danois, vient de découvrir qu'un [[courant électrique]] fait bouger l'aiguille d'une boussole. Je veux comprendre ce courant : le mesurer, le dompter.","es":"Ørsted, un danés, acaba de descubrir que una [[corriente eléctrica]] mueve la aguja de una brújula. Yo quiero entender esa corriente: medirla, domarla."},"Para eso hay que empezar por lo básico. {N}, en el banco de trabajo hay un circuito a medio montar. ¡Complétalo!":{"fr":"Pour ça, il faut commencer par la base. {N}, sur l'établi il y a un circuit à moitié monté. Termine-le !","es":"Para eso hay que empezar por lo básico. {N}, en el banco de trabajo hay un circuito a medio montar. ¡Complétalo!"},"Elige la herramienta «Fil» y arrastra de un punto dorado a otro para tender cables.":{"fr":"Choisis l'outil « Fil » et fais glisser d'un point doré à un autre pour tirer des fils.","es":"Elige la herramienta «Cable» y arrastra de un punto dorado a otro para tender cables."},"Allume la lampe":{"fr":"Allume la lampe","es":"Enciende la lámpara"},"Complète le circuit pour allumer L1":{"fr":"Complète le circuit pour allumer L1","es":"Completa el circuito para encender L1"},"Rellena los dos huecos con cables":{"fr":"Remplis les deux trous avec des fils","es":"Rellena los dos huecos con cables"},"Hay dos huecos en el circuito: uno a la derecha y otro abajo.":{"fr":"Il y a deux trous dans le circuit : un à droite et un en bas.","es":"Hay dos huecos en el circuito: uno a la derecha y otro abajo."},"Con la herramienta «Fil», arrastra entre los dos puntos de cada hueco.":{"fr":"Avec l'outil « Fil », fais glisser entre les deux points de chaque trou.","es":"Con la herramienta «Cable», arrastra entre los dos puntos de cada hueco."},"Magnifique ! Esa luz… ¡y esos puntitos que corren por los hilos!":{"fr":"Magnifique ! Cette lumière… et ces petits points qui courent dans les fils !","es":"¡Magnifique! Esa luz… ¡y esos puntitos que corren por los hilos!"},"Es el sentido convencional de la corriente: sale del + de la pila y vuelve por el −. Ahora, un interruptor para controlarla.":{"fr":"C'est le sens conventionnel du courant : il sort par le + de la pile et revient par le −. Maintenant, un interrupteur pour le contrôler.","es":"Es el sentido convencional de la corriente: sale del + de la pila y vuelve por el −. Ahora, un interruptor para controlarla."},"L'interrupteur":{"fr":"L'interrupteur","es":"El interruptor"},"Place l'interrupteur K dans le trou":{"fr":"Place l'interrupteur K dans le trou","es":"Coloca el interruptor K en el hueco"},"Coloca el interruptor en el hueco de abajo":{"fr":"Place l'interrupteur dans le trou du bas","es":"Coloca el interruptor en el hueco de abajo"},"Ouvre K : la lampe doit s'éteindre":{"fr":"Ouvre K : la lampe doit s'éteindre","es":"Abre K: la lámpara debe apagarse"},"Con la «Main», toca K para abrirlo":{"fr":"Avec la « Main », touche K pour l'ouvrir","es":"Con la «Mano», toca K para abrirlo"},"Referme K":{"fr":"Referme K","es":"Vuelve a cerrar K"},"Vuelve a tocarlo para cerrarlo":{"fr":"Touche-le encore pour le fermer","es":"Vuelve a tocarlo para cerrarlo"},"Elige «Interrupteur» y toca el hueco entre los dos puntos de abajo.":{"fr":"Choisis « Interrupteur » et touche le trou entre les deux points du bas.","es":"Elige «Interruptor» y toca el hueco entre los dos puntos de abajo."},"Con la herramienta «Main», un toque sobre el interruptor lo abre o lo cierra.":{"fr":"Avec l'outil « Main », une touche sur l'interrupteur l'ouvre ou le ferme.","es":"Con la herramienta «Mano», un toque sobre el interruptor lo abre o lo cierra."},"Interrupteur [[ouvert]] : que se passe-t-il ?":{"fr":"Interrupteur [[ouvert]] : que se passe-t-il ?","es":"Interruptor [[abierto]]: ¿qué pasa?"},"Le circuit est ouvert : le courant ne circule plus":{"fr":"Le circuit est ouvert : le courant ne circule plus","es":"El circuito está abierto: la corriente ya no circula"},"Le courant circule plus lentement":{"fr":"Le courant circule plus lentement","es":"La corriente circula más despacio"},"Seule la moitié du circuit fonctionne":{"fr":"Seule la moitié du circuit fonctionne","es":"Solo funciona la mitad del circuito"},"La lampe brille plus fort":{"fr":"La lampe brille plus fort","es":"La lámpara brilla más"},"Un interruptor abierto corta la boucle: el circuito queda abierto y la corriente deja de circular en todo el circuito.":{"fr":"Un interrupteur ouvert coupe la boucle : le circuit est ouvert et le courant ne circule plus nulle part.","es":"Un interruptor abierto corta el bucle: el circuito queda abierto y la corriente deja de circular en todo el circuito."},"L'ampèremètre":{"fr":"L'ampèremètre","es":"El amperímetro"},"Ver la corriente está bien. Pero un científico necesita MEDIR. ¿Cuánta corriente pasa? Lo llamaré… su «intensité».":{"fr":"Voir le courant, c'est bien. Mais un savant doit MESURER. Combien de courant passe ? J'appellerai cela… son [[intensité]].","es":"Ver la corriente está bien. Pero un científico necesita MEDIR. ¿Cuánta corriente pasa? Lo llamaré… su [[intensidad]]."},"¡Buen nombre! En el futuro se mide con un «ampèremètre». Y la unidad será… el ampère. En su honor.":{"fr":"Joli nom ! Dans le futur, on la mesure avec un [[ampèremètre]]. Et l'unité sera… l'ampère. En votre honneur.","es":"¡Buen nombre! En el futuro se mide con un [[amperímetro]]. Y la unidad será… el amperio. En su honor."},"¿En mi honor? Oh là là… Vite, enséñenme cómo se usa.":{"fr":"En mon honneur ? Oh là là… Vite, montrez-moi comment on l'utilise.","es":"¿En mi honor? Oh là là… Vite, enséñenme cómo se usa."},"Mesure l'intensité":{"fr":"Mesure l'intensité","es":"Mide la intensidad"},"Branche l'ampèremètre en série, dans le trou":{"fr":"Branche l'ampèremètre en série, dans le trou","es":"Conecta el amperímetro en serie, en el hueco"},"Coloca el amperímetro en el hueco de arriba":{"fr":"Place l'ampèremètre dans le trou du haut","es":"Coloca el amperímetro en el hueco de arriba"},"Lecture positive (sinon : inverse les bornes)":{"fr":"Lecture positive (sinon : inverse les bornes)","es":"Lectura positiva (si no, invierte los bornes)"},"Si sale negativo, selecciónalo e inviértelo":{"fr":"Si c'est négatif, sélectionne-le et inverse ses bornes","es":"Si sale negativo, selecciónalo e inviértelo"},"Note l'intensité : I = ? A":{"fr":"Note l'intensité : I = ? A","es":"Anota la intensidad: I = ? A"},"Escribe el valor que marca la pantalla":{"fr":"Écris la valeur affichée sur l'écran","es":"Escribe el valor que marca la pantalla"},"Elige «Ampèremètre» y toca el hueco entre los dos puntos de arriba a la derecha.":{"fr":"Choisis « Ampèremètre » et touche le trou entre les deux points en haut à droite.","es":"Elige «Amperímetro» y toca el hueco entre los dos puntos de arriba a la derecha."},"El punto rojo es la borne A: la corriente debe entrar por ahí. Si la pantalla marca «−», toca el amperímetro y pulsa «Inverser les bornes».":{"fr":"Le point rouge est la borne A : le courant doit entrer par là. Si l'écran affiche « − », touche l'ampèremètre et appuie sur « Inverser les bornes ».","es":"El punto rojo es el borne A: la corriente debe entrar por ahí. Si la pantalla marca «−», toca el amperímetro y pulsa «Invertir bornes»."},"Escribe con coma o con punto, como prefieras: 0,1 o 0.1.":{"fr":"Écris avec une virgule ou un point, comme tu préfères : 0,1 ou 0.1.","es":"Escribe con coma o con punto, como prefieras: 0,1 o 0.1."},"Comment branche-t-on un [[ampèremètre]] ?":{"fr":"Comment branche-t-on un [[ampèremètre]] ?","es":"¿Cómo se conecta un [[amperímetro]]?"},"En série, dans la boucle":{"fr":"En série, dans la boucle","es":"En serie, dentro del bucle"},"En dérivation, aux bornes de la lampe":{"fr":"En dérivation, aux bornes de la lampe","es":"En paralelo, en los bornes de la lámpara"},"À la place du générateur":{"fr":"À la place du générateur","es":"En lugar del generador"},"Il n'y a pas de règle":{"fr":"Il n'y a pas de règle","es":"No hay ninguna regla"},"El «ampèremètre» se conecta «en série»: se abre el circuito y se mete dentro, para que toda la corriente lo atraviese.":{"fr":"L'[[ampèremètre]] se branche [[en série]] : on ouvre le circuit et on le place dedans, pour que tout le courant le traverse.","es":"El [[amperímetro]] se conecta [[en serie]]: se abre el circuito y se mete dentro, para que toda la corriente lo atraviese."},"0,25 A = combien de [[mA]] ?":{"fr":"0,25 A = combien de [[mA]] ?","es":"0,25 A = ¿cuántos [[mA]]?"},"250 mA":{"fr":"250 mA","es":"250 mA"},"25 mA":{"fr":"25 mA","es":"25 mA"},"2 500 mA":{"fr":"2 500 mA","es":"2500 mA"},"0,025 mA":{"fr":"0,025 mA","es":"0,025 mA"},"1 A = 1000 mA, así que 0,25 × 1000 = «250 mA».":{"fr":"1 A = 1000 mA, donc 0,25 × 1000 = [[250 mA]].","es":"1 A = 1000 mA, así que 0,25 × 1000 = [[250 mA]]."},"Le piège du Baron":{"fr":"Le piège du Baron","es":"La trampa del Barón"},"¡Buenas noches, señores científicos! Qué aparatito tan bonito. Un consejo de amigo: ¡conectad el amperímetro en derivación, sobre la lámpara! Medirá mucho mejor.":{"fr":"Bonsoir, chers savants ! Quel joli petit appareil. Un conseil d'ami : branchez l'ampèremètre en dérivation, sur la lampe ! Il mesurera bien mieux.","es":"¡Buenas noches, queridos científicos! Qué aparatito tan bonito. Un consejo de amigo: ¡conectad el amperímetro en paralelo con la lámpara! Medirá mucho mejor."},"¿Es usted el ladrón de mis notas? ¡Fuera de mi laboratorio!":{"fr":"C'est vous, le voleur de mes notes ? Sortez de mon laboratoire !","es":"¿Es usted el ladrón de mis notas? ¡Fuera de mi laboratorio!"},"Ja, ja. Pruébelo y verá…":{"fr":"Ha, ha. Essayez donc, vous verrez…","es":"Ja, ja. Pruébelo y verá…"},"Es una trampa, estoy segura. Pero los científicos comprobamos las cosas. Usemos un amperímetro de repuesto y hagamos la prueba… con cuidado.":{"fr":"C'est un piège, j'en suis sûre. Mais les scientifiques vérifient les choses. Prenons un ampèremètre de rechange et faisons l'essai… avec prudence.","es":"Es una trampa, estoy segura. Pero los científicos comprobamos las cosas. Usemos un amperímetro de repuesto y hagamos la prueba… con cuidado."},"Expérience interdite":{"fr":"Expérience interdite","es":"Experimento prohibido"},"Branche l'ampèremètre en dérivation, aux bornes de L1":{"fr":"Branche l'ampèremètre en dérivation, aux bornes de L1","es":"Conecta el amperímetro en paralelo, en los bornes de L1"},"Haz un puente por debajo de L1: dos cables hacia abajo y el amperímetro entre ellos":{"fr":"Fais un pont sous L1 : deux fils vers le bas et l'ampèremètre entre les deux","es":"Haz un puente por debajo de L1: dos cables hacia abajo y el amperímetro entre ellos"},"Maintenant, branche un ampèremètre correctement : en série":{"fr":"Maintenant, branche un ampèremètre correctement : en série","es":"Ahora, conecta un amperímetro correctamente: en serie"},"Borra el puente, borra el cable azul discontinuo de arriba a la izquierda y pon ahí un amperímetro":{"fr":"Efface le pont, efface le fil bleu en pointillés en haut à gauche et mets un ampèremètre à sa place","es":"Borra el puente, borra el cable azul discontinuo de arriba a la izquierda y pon ahí un amperímetro"},"Baja un cable desde cada borne de L1 (los dos puntos a los lados de la lámpara) hasta la fila de abajo, y pon el amperímetro entre ellos.":{"fr":"Descends un fil depuis chaque borne de L1 (les deux points de chaque côté de la lampe) jusqu'à la rangée du bas, et mets l'ampèremètre entre les deux.","es":"Baja un cable desde cada borne de L1 (los dos puntos a los lados de la lámpara) hasta la fila de abajo, y pon el amperímetro entre ellos."},"Después, con la goma, borra el amperímetro quemado, los cables del puente y el cable azul discontinuo de arriba a la izquierda. En ese hueco va el amperímetro nuevo.":{"fr":"Ensuite, avec la gomme, efface l'ampèremètre grillé, les fils du pont et le fil bleu en pointillés en haut à gauche. Le nouvel ampèremètre va dans ce trou.","es":"Después, con la goma, borra el amperímetro quemado, los cables del puente y el cable azul discontinuo de arriba a la izquierda. En ese hueco va el amperímetro nuevo."},"Pourquoi le fusible de l'ampèremètre a-t-il [[fondu]] ?":{"fr":"Pourquoi le fusible de l'ampèremètre a-t-il [[fondu]] ?","es":"¿Por qué se ha [[fundido]] el fusible del amperímetro?"},"Il n'a presque pas de résistance : en dérivation, il crée un court-circuit":{"fr":"Il n'a presque pas de résistance : en dérivation, il crée un court-circuit","es":"Casi no tiene resistencia: en paralelo, provoca un cortocircuito"},"La lampe était trop puissante":{"fr":"La lampe était trop puissante","es":"La lámpara era demasiado potente"},"Le générateur était à l'envers":{"fr":"Le générateur était à l'envers","es":"El generador estaba al revés"},"L'ampèremètre était trop vieux":{"fr":"L'ampèremètre était trop vieux","es":"El amperímetro era demasiado viejo"},"Un amperímetro casi no tiene resistencia. En derivación, la corriente pasa toda por él en lugar de por la lámpara: es un cortocircuito.":{"fr":"Un ampèremètre n'a presque pas de résistance. En dérivation, tout le courant passe par lui au lieu de passer par la lampe : c'est un court-circuit.","es":"Un amperímetro casi no tiene resistencia. En paralelo, la corriente pasa toda por él en lugar de por la lámpara: es un cortocircuito."},"¡Bah! Esta vez habéis tenido suerte. ¡Pero la Académie se reirá de usted, Ampère!":{"fr":"Bah ! Cette fois, vous avez eu de la chance. Mais l'Académie se moquera de vous, Ampère !","es":"¡Bah! Esta vez habéis tenido suerte. ¡Pero la Académie se reirá de usted, Ampère!"},"Se ha ido. Bien hecho, {N}: ahora sabes por qué un amperímetro va SIEMPRE en serie.":{"fr":"Il est parti. Bravo, {N} : maintenant, tu sais pourquoi un ampèremètre se branche TOUJOURS en série.","es":"Se ha ido. Bien hecho, {N}: ahora sabes por qué un amperímetro va SIEMPRE en serie."},"L'intensité ne s'use pas":{"fr":"L'intensité ne s'use pas","es":"La corriente no se gasta"},"Tengo una duda. Si la lámpara brilla, quizá «gasta» corriente. Entonces, después de la lámpara, debería quedar menos… ¿no?":{"fr":"J'ai un doute. Si la lampe brille, elle « consomme » peut-être du courant. Alors, après la lampe, il devrait en rester moins… non ?","es":"Tengo una duda. Si la lámpara brilla, quizá «gasta» corriente. Entonces, después de la lámpara, debería quedar menos… ¿no?"},"Mucha gente lo piensa. Antes de medir: ¿tú qué crees, {N}?":{"fr":"Beaucoup de gens le pensent. Avant de mesurer : à ton avis, {N} ?","es":"Mucha gente lo piensa. Antes de medir: ¿tú qué crees, {N}?"},"Avant la lampe, I = 0,1 A. [[Après]] la lampe, l'intensité est…":{"fr":"Avant la lampe, I = 0,1 A. [[Après]] la lampe, l'intensité est…","es":"Antes de la lámpara, I = 0,1 A. [[Después]] de la lámpara, la intensidad es…"},"La même : 0,1 A":{"fr":"La même : 0,1 A","es":"La misma: 0,1 A"},"Plus petite":{"fr":"Plus petite","es":"Menor"},"Plus grande":{"fr":"Plus grande","es":"Mayor"},"Nulle":{"fr":"Nulle","es":"Nula"},"Vamos a comprobarlo con tres amperímetros.":{"fr":"On va le vérifier avec trois ampèremètres.","es":"Vamos a comprobarlo con tres amperímetros."},"Trois mesures":{"fr":"Trois mesures","es":"Tres medidas"},"Place les 3 ampèremètres dans les 3 trous":{"fr":"Place les 3 ampèremètres dans les 3 trous","es":"Coloca los 3 amperímetros en los 3 huecos"},"Uno antes de L1, uno entre las lámparas y uno al final":{"fr":"Un avant L1, un entre les lampes et un à la fin","es":"Uno antes de L1, uno entre las lámparas y uno al final"},"Les trois lectures positives":{"fr":"Les trois lectures positives","es":"Las tres lecturas positivas"},"Invierte el que marque negativo":{"fr":"Inverse celui qui affiche une valeur négative","es":"Invierte el que marque negativo"},"Que vaut l'intensité partout ? I = ? A":{"fr":"Que vaut l'intensité partout ? I = ? A","es":"¿Cuánto vale la intensidad en todas partes? I = ? A"},"Escribe el valor común":{"fr":"Écris la valeur commune","es":"Escribe el valor común"},"Los huecos están arriba a la izquierda, a la derecha y abajo.":{"fr":"Les trous sont en haut à gauche, à droite et en bas.","es":"Los huecos están arriba a la izquierda, a la derecha y abajo."},"Abajo la corriente vuelve de derecha a izquierda: ese amperímetro saldrá negativo. Selecciónalo y pulsa «Inverser les bornes».":{"fr":"En bas, le courant revient de droite à gauche : cet ampèremètre affichera une valeur négative. Sélectionne-le et appuie sur « Inverser les bornes ».","es":"Abajo la corriente vuelve de derecha a izquierda: ese amperímetro saldrá negativo. Selecciónalo y pulsa «Invertir bornes»."},"Quelle est la [[loi d'unicité]] de l'intensité ?":{"fr":"Quelle est la [[loi d'unicité]] de l'intensité ?","es":"¿Qué dice la [[ley de unicidad]] de la intensidad?"},"Dans un circuit en série, l'intensité est la même en tout point":{"fr":"Dans un circuit en série, l'intensité est la même en tout point","es":"En un circuito en serie, la intensidad es la misma en todos los puntos"},"Dans un circuit en série, l'intensité diminue après chaque lampe":{"fr":"Dans un circuit en série, l'intensité diminue après chaque lampe","es":"En un circuito en serie, la intensidad disminuye después de cada lámpara"},"Dans un circuit en dérivation, l'intensité est la même partout":{"fr":"Dans un circuit en dérivation, l'intensité est la même partout","es":"En un circuito en paralelo, la intensidad es la misma en todas partes"},"L'intensité est toujours de 1 A":{"fr":"L'intensité est toujours de 1 A","es":"La intensidad siempre es de 1 A"},"«Dans un circuit en série, l'intensité du courant est la même en tout point.»":{"fr":"« Dans un circuit en série, l'intensité du courant est la même en tout point. »","es":"«En un circuito en serie, la intensidad de la corriente es la misma en todos los puntos»."},"¡La corriente no se gasta: circula! Como el agua en un molino: mueve la rueda, pero no desaparece. ¡Qué idea tan bella!":{"fr":"Le courant ne s'use pas : il circule ! Comme l'eau dans un moulin : elle fait tourner la roue, mais elle ne disparaît pas. Quelle belle idée !","es":"¡La corriente no se gasta: circula! Como el agua en un molino: mueve la rueda, pero no desaparece. ¡Qué idea tan bella!"},"La loi des nœuds":{"fr":"La loi des nœuds","es":"La ley de los nudos"},"¿Y si el camino se divide en dos? Como un río que rodea una isla.":{"fr":"Et si le chemin se sépare en deux ? Comme une rivière qui entoure une île.","es":"¿Y si el camino se divide en dos? Como un río que rodea una isla."},"Eso es un circuito «en dérivation». El punto donde se separan los cables es un «nœud». Montemos uno con dos lámparas diferentes.":{"fr":"C'est un circuit [[en dérivation]]. Le point où les fils se séparent s'appelle un [[nœud]]. Montons-en un avec deux lampes différentes.","es":"Eso es un circuito [[en paralelo]] (en Francia lo llaman «en dérivation»). El punto donde se separan los cables es un [[nudo]]. Montemos uno con dos lámparas diferentes."},"Partage du courant":{"fr":"Partage du courant","es":"Reparto de la corriente"},"Mesure I dans la branche principale":{"fr":"Mesure I dans la branche principale","es":"Mide I en la rama principal"},"Amperímetro en el hueco de arriba a la izquierda":{"fr":"Ampèremètre dans le trou en haut à gauche","es":"Amperímetro en el hueco de arriba a la izquierda"},"Mesure I1 dans la branche de L1":{"fr":"Mesure I1 dans la branche de L1","es":"Mide I1 en la rama de L1"},"Amperímetro debajo de L1":{"fr":"Ampèremètre sous L1","es":"Amperímetro debajo de L1"},"Mesure I2 dans la branche de L2":{"fr":"Mesure I2 dans la branche de L2","es":"Mide I2 en la rama de L2"},"Amperímetro debajo de L2":{"fr":"Ampèremètre sous L2","es":"Amperímetro debajo de L2"},"I1 = ? A":{"fr":"I1 = ? A","es":"I1 = ? A"},"Intensidad en la rama de L1":{"fr":"Intensité dans la branche de L1","es":"Intensidad en la rama de L1"},"I2 = ? A":{"fr":"I2 = ? A","es":"I2 = ? A"},"Intensidad en la rama de L2":{"fr":"Intensité dans la branche de L2","es":"Intensidad en la rama de L2"},"I (branche principale) = ? A":{"fr":"I (branche principale) = ? A","es":"I (rama principal) = ? A"},"Intensidad total":{"fr":"Intensité totale","es":"Intensidad total"},"Tres huecos: arriba a la izquierda (rama principal), debajo de L1 y debajo de L2.":{"fr":"Trois trous : en haut à gauche (branche principale), sous L1 et sous L2.","es":"Tres huecos: arriba a la izquierda (rama principal), debajo de L1 y debajo de L2."},"Compara: ¿cuánto suman I1 e I2?":{"fr":"Compare : combien font I1 + I2 ?","es":"Compara: ¿cuánto suman I1 e I2?"},"Dérivation : I = 0,8 A et I1 = 0,3 A. Que vaut [[I2]] ?":{"fr":"Dérivation : I = 0,8 A et I1 = 0,3 A. Que vaut [[I2]] ?","es":"Paralelo: I = 0,8 A e I1 = 0,3 A. ¿Cuánto vale [[I2]]?"},"Ley de los nudos: I = I1 + I2, así que I2 = I − I1 = 0,8 − 0,3 = «0,5 A».":{"fr":"Loi des nœuds : I = I1 + I2, donc I2 = I − I1 = 0,8 − 0,3 = [[0,5 A]].","es":"Ley de los nudos: I = I1 + I2, así que I2 = I − I1 = 0,8 − 0,3 = [[0,5 A]]."},"Quelle relation est juste dans un circuit [[en dérivation]] ?":{"fr":"Quelle relation est juste dans un circuit [[en dérivation]] ?","es":"¿Qué relación es correcta en un circuito [[en paralelo]]?"},"I = I1 + I2":{"fr":"I = I1 + I2","es":"I = I1 + I2"},"I = I1 = I2":{"fr":"I = I1 = I2","es":"I = I1 = I2"},"I1 = I + I2":{"fr":"I1 = I + I2","es":"I1 = I + I2"},"I = I1 − I2":{"fr":"I = I1 − I2","es":"I = I1 − I2"},"«Loi d'additivité des intensités»: la corriente principal es la suma de las corrientes de las ramas.":{"fr":"[[Loi d'additivité des intensités]] : le courant principal est la somme des courants des branches.","es":"[[Ley de los nudos]]: la corriente principal es la suma de las corrientes de las ramas."},"Devant l'Académie":{"fr":"Devant l'Académie","es":"Ante la Académie"},"Académie des sciences, 18 de septiembre de 1820. Los sabios más importantes de Francia esperan.":{"fr":"Académie des sciences, 18 septembre 1820. Les plus grands savants de France attendent.","es":"Académie des sciences, 18 de septiembre de 1820. Los sabios más importantes de Francia esperan."},"Monsieur Ampère, la Académie le escucha. Dicen que trae ideas nuevas sobre la corriente.":{"fr":"Monsieur Ampère, l'Académie vous écoute. On dit que vous apportez des idées nouvelles sur le courant.","es":"Monsieur Ampère, la Académie le escucha. Dicen que trae ideas nuevas sobre la corriente."},"(desde el fondo) ¡Patrañas! ¡Que conteste a nuestras preguntas si es tan listo!":{"fr":"(du fond de la salle) Balivernes ! Qu'il réponde donc à nos questions, s'il est si malin !","es":"(desde el fondo) ¡Patrañas! ¡Que conteste a nuestras preguntas si es tan listo!"},"{N}, el Barón ha llenado la sala de preguntas trampa. Ampère necesita tu ayuda: tres vidas, seis preguntas.":{"fr":"{N}, le Baron a rempli la salle de questions pièges. Ampère a besoin de toi : trois vies, six questions.","es":"{N}, el Barón ha llenado la sala de preguntas trampa. Ampère necesita tu ayuda: tres vidas, seis preguntas."},"Les questions de l'Académie":{"fr":"Les questions de l'Académie","es":"Las preguntas de la Académie"},"250 mA = ? A":{"fr":"250 mA = ? A","es":"250 mA = ? A"},"0,25 A":{"fr":"0,25 A","es":"0,25 A"},"2,5 A":{"fr":"2,5 A","es":"2,5 A"},"25 A":{"fr":"25 A","es":"25 A"},"0,025 A":{"fr":"0,025 A","es":"0,025 A"},"Se divide entre 1000: 250 ÷ 1000 = 0,25 A.":{"fr":"On divise par 1000 : 250 ÷ 1000 = 0,25 A.","es":"Se divide entre 1000: 250 ÷ 1000 = 0,25 A."},"Le courant entre dans l'ampèremètre par la borne…":{"fr":"Le courant entre dans l'ampèremètre par la borne…","es":"La corriente entra en el amperímetro por el borne…"},"A (ou mA)":{"fr":"A (ou mA)","es":"A (o mA)"},"COM":{"fr":"COM","es":"COM"},"V":{"fr":"V","es":"V"},"Ω":{"fr":"Ω","es":"Ω"},"Entra por A (o mA) y sale por COM.":{"fr":"Il entre par A (ou mA) et sort par COM.","es":"Entra por A (o mA) y sale por COM."},"Circuit en série : I1 = 0,2 A. Que vaut I3 plus loin ?":{"fr":"Circuit en série : I1 = 0,2 A. Que vaut I3 plus loin ?","es":"Circuito en serie: I1 = 0,2 A. ¿Cuánto vale I3 más adelante?"},"0,2 A":{"fr":"0,2 A","es":"0,2 A"},"0,1 A":{"fr":"0,1 A","es":"0,1 A"},"0,4 A":{"fr":"0,4 A","es":"0,4 A"},"0 A":{"fr":"0 A","es":"0 A"},"En serie la intensidad es la misma en todos los puntos.":{"fr":"En série, l'intensité est la même en tout point.","es":"En serie la intensidad es la misma en todos los puntos."},"Dérivation : I1 = 0,15 A, I2 = 0,35 A. I = ? A":{"fr":"Dérivation : I1 = 0,15 A, I2 = 0,35 A. I = ? A","es":"Paralelo: I1 = 0,15 A, I2 = 0,35 A. I = ? A"},"I = I1 + I2 = 0,15 + 0,35 = 0,5 A.":{"fr":"I = I1 + I2 = 0,15 + 0,35 = 0,5 A.","es":"I = I1 + I2 = 0,15 + 0,35 = 0,5 A."},"Un ampèremètre branché en dérivation provoque…":{"fr":"Un ampèremètre branché en dérivation provoque…","es":"Un amperímetro conectado en paralelo provoca…"},"un court-circuit":{"fr":"un court-circuit","es":"un cortocircuito"},"une mesure parfaite":{"fr":"une mesure parfaite","es":"una medida perfecta"},"une tension nulle partout":{"fr":"une tension nulle partout","es":"una tensión nula en todas partes"},"rien de spécial":{"fr":"rien de spécial","es":"nada especial"},"Casi no tiene resistencia: es un cortocircuito.":{"fr":"Il n'a presque pas de résistance : c'est un court-circuit.","es":"Casi no tiene resistencia: es un cortocircuito."},"Un nœud, c'est…":{"fr":"Un nœud, c'est…","es":"Un nudo es…"},"un point où se rejoignent au moins trois fils":{"fr":"un point où se rejoignent au moins trois fils","es":"un punto donde se unen al menos tres cables"},"le milieu d'un fil":{"fr":"le milieu d'un fil","es":"el centro de un cable"},"la borne + du générateur":{"fr":"la borne + du générateur","es":"el borne + del generador"},"un interrupteur":{"fr":"un interrupteur","es":"un interruptor"},"En un nudo se juntan tres cables o más: ahí la corriente se reparte.":{"fr":"Dans un nœud, au moins trois fils se rejoignent : c'est là que le courant se partage.","es":"En un nudo se juntan tres cables o más: ahí la corriente se reparte."},"¡Bravo, monsieur Ampère! Esto abre una ciencia nueva.":{"fr":"Bravo, monsieur Ampère ! Voilà qui ouvre une science nouvelle.","es":"¡Bravo, monsieur Ampère! Esto abre una ciencia nueva."},"La llamaré «électrodynamique». Y no lo habría logrado sin mis amigos del futuro.":{"fr":"Je l'appellerai l'[[électrodynamique]]. Et je n'y serais pas arrivé sans mes amis du futur.","es":"La llamaré [[electrodinámica]]. Y no lo habría logrado sin mis amigos del futuro."},"¡Grrr! ¡Esto no ha terminado! ¡Me voy a Colonia… y allí nadie salvará a ese profesor de matemáticas!":{"fr":"Grrr ! Ce n'est pas fini ! Je pars à Cologne… et là-bas, personne ne sauvera ce professeur de mathématiques !","es":"¡Grrr! ¡Esto no ha terminado! ¡Me voy a Colonia… y allí nadie salvará a ese profesor de matemáticas!"},"¡Página 1 recuperada! El amperio vuelve a existir en el futuro.":{"fr":"Page 1 récupérée ! L'ampère existe de nouveau dans le futur.","es":"¡Página 1 recuperada! El amperio vuelve a existir en el futuro."},"Adieu, mes amis. Si algún día una unidad lleva mi nombre… sabré a quién dar las gracias.":{"fr":"Adieu, mes amis. Si un jour une unité porte mon nom… je saurai qui remercier.","es":"Adieu, mes amis. Si algún día una unidad lleva mi nombre… sabré a quién dar las gracias."},"Cologne":{"fr":"Cologne","es":"Colonia"},"Colonia, 1826-1827":{"fr":"Cologne, 1826-1827","es":"Colonia, 1826-1827"},"La résistance":{"fr":"La résistance","es":"La resistencia"},"Resistencias y ley de Ohm":{"fr":"Les résistances et la loi d'Ohm","es":"Resistencias y ley de Ohm"},"Page 2 · La loi d'Ohm":{"fr":"Page 2 · La loi d'Ohm","es":"Página 2 · La ley de Ohm"},"La résistance freine":{"fr":"La résistance freine","es":"La resistencia frena"},"Colonia, 1826. El gimnasio de los jesuitas. Por la ventana se ve la catedral, sin terminar, con una grúa de madera en lo alto de la torre.":{"fr":"Cologne, 1826. Le lycée des jésuites. Par la fenêtre, on voit la cathédrale inachevée, avec une grue en bois tout en haut de la tour.","es":"Colonia, 1826. El colegio de los jesuitas. Por la ventana se ve la catedral, sin terminar, con una grúa de madera en lo alto de la torre."},"Guten Abend. Soy Georg Simon Ohm, profesor de matemáticas y de física. Llevo años midiendo corrientes con hilos de distintas longitudes y grosores…":{"fr":"Guten Abend. Je suis Georg Simon Ohm, professeur de mathématiques et de physique. Depuis des années, je mesure des courants avec des fils de longueurs et d'épaisseurs différentes…","es":"Guten Abend. Soy Georg Simon Ohm, profesor de matemáticas y de física. Llevo años midiendo corrientes con hilos de distintas longitudes y grosores…"},"Los hilos largos y finos dejan pasar menos corriente. Pero mis pilas se agotan y mis medidas bailan. Y ahora un barón con monóculo va diciendo por toda la ciudad que soy un loco.":{"fr":"Les fils longs et fins laissent passer moins de courant. Mais mes piles s'épuisent et mes mesures dansent. Et maintenant, un baron à monocle raconte dans toute la ville que je suis fou.","es":"Los hilos largos y finos dejan pasar menos corriente. Pero mis pilas se agotan y mis medidas bailan. Y ahora un barón con monóculo va diciendo por toda la ciudad que soy un loco."},"¡No está loco, profesor! Lo que usted estudia se llama «résistance». {N}, enseñémosle cómo frena la corriente.":{"fr":"Vous n'êtes pas fou, professeur ! Ce que vous étudiez s'appelle la [[résistance]]. {N}, montrons-lui comment elle freine le courant.","es":"¡No está loco, profesor! Lo que usted estudia se llama [[resistencia]]. {N}, enseñémosle cómo frena la corriente."},"Résistance en série":{"fr":"Résistance en série","es":"Resistencia en serie"},"Remplace le fil bleu en pointillés (en bas) par une résistance":{"fr":"Remplace le fil bleu en pointillés (en bas) par une résistance","es":"Sustituye el cable azul discontinuo (abajo) por una resistencia"},"Bórralo con la goma y coloca una resistencia en su lugar":{"fr":"Efface-le avec la gomme et place une résistance à sa place","es":"Bórralo con la goma y coloca una resistencia en su lugar"},"Choisis R pour que L1 brille à peine":{"fr":"Choisis R pour que L1 brille à peine","es":"Elige R para que L1 apenas brille"},"Selecciona la resistencia y prueba valores":{"fr":"Sélectionne la résistance et essaie des valeurs","es":"Selecciona la resistencia y prueba valores"},"Choisis la valeur qui laisse passer le plus de courant":{"fr":"Choisis la valeur qui laisse passer le plus de courant","es":"Elige el valor que deja pasar más corriente"},"¿Qué resistencia frena menos?":{"fr":"Quelle résistance freine le moins ?","es":"¿Qué resistencia frena menos?"},"Avec cette résistance, I = ? A":{"fr":"Avec cette résistance, I = ? A","es":"Con esta resistencia, I = ? A"},"Lee el amperímetro A1":{"fr":"Lis l'ampèremètre A1","es":"Lee el amperímetro A1"},"Usa la goma sobre el cable azul discontinuo de abajo. Luego elige «Résistance» y toca ese hueco.":{"fr":"Utilise la gomme sur le fil bleu en pointillés du bas. Puis choisis « Résistance » et touche ce trou.","es":"Usa la goma sobre el cable azul discontinuo de abajo. Luego elige «Resistencia» y toca ese hueco."},"Con la «Main», toca la resistencia: verás los valores 10, 47, 100 y 470 Ω.":{"fr":"Avec la « Main », touche la résistance : tu verras les valeurs 10, 47, 100 et 470 Ω.","es":"Con la «Mano», toca la resistencia: verás los valores 10, 47, 100 y 470 Ω."},"Cuanto más pequeña la resistencia, más corriente pasa.":{"fr":"Plus la résistance est petite, plus le courant passe.","es":"Cuanto más pequeña la resistencia, más corriente pasa."},"Dans un circuit en série, si on [[augmente]] la résistance, l'intensité…":{"fr":"Dans un circuit en série, si on [[augmente]] la résistance, l'intensité…","es":"En un circuito en serie, si [[aumentamos]] la resistencia, la intensidad…"},"diminue":{"fr":"diminue","es":"disminuye"},"augmente":{"fr":"augmente","es":"aumenta"},"ne change pas":{"fr":"ne change pas","es":"no cambia"},"devient négative":{"fr":"devient négative","es":"se vuelve negativa"},"Una resistencia mayor frena más la corriente: la intensidad «diminue».":{"fr":"Une résistance plus grande freine davantage le courant : l'intensité [[diminue]].","es":"Una resistencia mayor frena más la corriente: la intensidad [[disminuye]]."},"L'unité de la résistance est…":{"fr":"L'unité de la résistance est…","es":"La unidad de la resistencia es…"},"l'ohm (Ω)":{"fr":"l'ohm (Ω)","es":"el ohmio (Ω)"},"l'ampère (A)":{"fr":"l'ampère (A)","es":"el amperio (A)"},"le volt (V)":{"fr":"le volt (V)","es":"el voltio (V)"},"le watt (W)":{"fr":"le watt (W)","es":"el vatio (W)"},"La resistencia se mide en «ohms», símbolo Ω (omega).":{"fr":"La résistance se mesure en [[ohms]], symbole Ω (oméga).","es":"La resistencia se mide en [[ohmios]], símbolo Ω (omega)."},"Le code des couleurs":{"fr":"Le code des couleurs","es":"El código de colores"},"¿Y esas rayitas de colores en sus resistencias?":{"fr":"Et ces petites rayures de couleur sur vos résistances ?","es":"¿Y esas rayitas de colores en sus resistencias?"},"En el futuro, las resistencias son tan pequeñas que no se puede escribir el número. Así que se pinta con colores. ¡Es un código secreto!":{"fr":"Dans le futur, les résistances sont si petites qu'on ne peut pas écrire le nombre dessus. Alors on le peint en couleurs. C'est un code secret !","es":"En el futuro, las resistencias son tan pequeñas que no se puede escribir el número. Así que se pinta con colores. ¡Es un código secreto!"},"Wunderbar! Un código como los de los espías. Mis alumnos lo adorarían.":{"fr":"Wunderbar ! Un code comme ceux des espions. Mes élèves adoreraient.","es":"¡Wunderbar! Un código como los de los espías. A mis alumnos les encantaría."},"La caractéristique":{"fr":"La caractéristique","es":"La gráfica característica"},"Mi idea es esta: si aumento la tensión, la intensidad aumenta… siempre en la misma proporción. Pero necesito medidas limpias para demostrarlo.":{"fr":"Mon idée, la voici : si j'augmente la tension, l'intensité augmente… toujours dans la même proportion. Mais il me faut des mesures propres pour le prouver.","es":"Mi idea es esta: si aumento la tensión, la intensidad aumenta… siempre en la misma proporción. Pero necesito medidas limpias para demostrarlo."},"Para eso, en lugar de pilas que se agotan, usaremos un generador regulable. Mide U e I para varias tensiones y apunta cada punto en la gráfica.":{"fr":"Pour ça, au lieu de piles qui s'épuisent, on va utiliser un générateur réglable. Mesure U et I pour plusieurs tensions et place chaque point sur le graphique.","es":"Para eso, en lugar de pilas que se agotan, usaremos un generador regulable. Mide U e I para varias tensiones y apunta cada punto en la gráfica."},"Ja! Yo usé un termopar, dos metales: uno en agua hirviendo y otro en hielo. ¡Muy estable!":{"fr":"Ja ! Moi, j'ai utilisé un thermocouple : deux métaux, l'un dans l'eau bouillante et l'autre dans la glace. Très stable !","es":"¡Ja! Yo usé un termopar: dos metales, uno en agua hirviendo y otro en hielo. ¡Muy estable!"},"Tracer U = f(I)":{"fr":"Tracer U = f(I)","es":"Dibujar U en función de I"},"Enregistre au moins 5 points différents":{"fr":"Enregistre au moins 5 points différents","es":"Registra al menos 5 puntos diferentes"},"Mueve la tensión del generador G y pulsa «Enregistrer» cada vez":{"fr":"Change la tension du générateur G et appuie sur « Enregistrer » à chaque fois","es":"Cambia la tensión del generador G y pulsa «Registrar» cada vez"},"Avec un de tes points, calcule R = U ÷ I. R = ? Ω":{"fr":"Avec un de tes points, calcule R = U ÷ I. R = ? Ω","es":"Con uno de tus puntos, calcula R = U ÷ I. R = ? Ω"},"Divide la tensión entre la intensidad de un punto":{"fr":"Divise la tension par l'intensité d'un point","es":"Divide la tensión entre la intensidad de un punto"},"Toca el generador G y mueve el deslizador. Luego pulsa «Enregistrer la mesure».":{"fr":"Touche le générateur G et déplace le curseur. Puis appuie sur « Enregistrer la mesure ».","es":"Toca el generador G y mueve el deslizador. Luego pulsa «Registrar la medida»."},"Elige tensiones distintas: 2 V, 4 V, 6 V, 8 V, 10 V…":{"fr":"Choisis des tensions différentes : 2 V, 4 V, 6 V, 8 V, 10 V…","es":"Elige tensiones distintas: 2 V, 4 V, 6 V, 8 V, 10 V…"},"Ejemplo: si U = 6 V e I = 0,06 A, entonces R = 6 ÷ 0,06.":{"fr":"Exemple : si U = 6 V et I = 0,06 A, alors R = 6 ÷ 0,06.","es":"Ejemplo: si U = 6 V e I = 0,06 A, entonces R = 6 ÷ 0,06."},"La caractéristique U = f(I) d'un conducteur ohmique est…":{"fr":"La caractéristique U = f(I) d'un conducteur ohmique est…","es":"La característica U = f(I) de un conductor óhmico es…"},"une droite qui passe par l'origine":{"fr":"une droite qui passe par l'origine","es":"una recta que pasa por el origen"},"une courbe qui monte de plus en plus vite":{"fr":"une courbe qui monte de plus en plus vite","es":"una curva que sube cada vez más deprisa"},"une droite horizontale":{"fr":"une droite horizontale","es":"una recta horizontal"},"un cercle":{"fr":"un cercle","es":"un círculo"},"U e I son proporcionales: la gráfica es una recta que pasa por el origen.":{"fr":"U et I sont proportionnelles : le graphique est une droite qui passe par l'origine.","es":"U e I son proporcionales: la gráfica es una recta que pasa por el origen."},"La loi d'Ohm":{"fr":"La loi d'Ohm","es":"La ley de Ohm"},"¡Lo veo claro! La tensión es igual a la resistencia multiplicada por la intensidad. Lo escribiré en mi libro: «Die galvanische Kette».":{"fr":"Je le vois clairement ! La tension est égale à la résistance multipliée par l'intensité. Je l'écrirai dans mon livre : « Die galvanische Kette ».","es":"¡Lo veo claro! La tensión es igual a la resistencia multiplicada por la intensidad. Lo escribiré en mi libro: «Die galvanische Kette»."},"En el futuro, todos los alumnos del mundo la estudian. Se llama… ¡la ley de Ohm!":{"fr":"Dans le futur, tous les élèves du monde l'étudient. Elle s'appelle… la loi d'Ohm !","es":"En el futuro, todos los alumnos del mundo la estudian. Se llama… ¡la ley de Ohm!"},"Un conducteur ohmique de R = 220 Ω est traversé par I = 0,03 A. Calcule la tension U.":{"fr":"Un conducteur ohmique de R = 220 Ω est traversé par I = 0,03 A. Calcule la tension U.","es":"Por un conductor óhmico de R = 220 Ω circula una intensidad I = 0,03 A. Calcula la tensión U."},"Formule":{"fr":"Formule","es":"Fórmula"},"U = R × I":{"fr":"U = R × I","es":"U = R × I"},"U = R ÷ I":{"fr":"U = R ÷ I","es":"U = R ÷ I"},"U = I ÷ R":{"fr":"U = I ÷ R","es":"U = I ÷ R"},"Calcul":{"fr":"Calcul","es":"Cálculo"},"U = 220 × 0,03":{"fr":"U = 220 × 0,03","es":"U = 220 × 0,03"},"U = 220 ÷ 0,03":{"fr":"U = 220 ÷ 0,03","es":"U = 220 ÷ 0,03"},"U = 0,03 ÷ 220":{"fr":"U = 0,03 ÷ 220","es":"U = 0,03 ÷ 220"},"U = R × I = 220 × 0,03 = «6,6 V».":{"fr":"U = R × I = 220 × 0,03 = [[6,6 V]].","es":"U = R × I = 220 × 0,03 = [[6,6 V]]."},"Un générateur de 12 V alimente une résistance de 400 Ω. Calcule l'intensité I.":{"fr":"Un générateur de 12 V alimente une résistance de 400 Ω. Calcule l'intensité I.","es":"Un generador de 12 V alimenta una resistencia de 400 Ω. Calcula la intensidad I."},"I = U ÷ R":{"fr":"I = U ÷ R","es":"I = U ÷ R"},"I = U × R":{"fr":"I = U × R","es":"I = U × R"},"I = R ÷ U":{"fr":"I = R ÷ U","es":"I = R ÷ U"},"I = 12 ÷ 400":{"fr":"I = 12 ÷ 400","es":"I = 12 ÷ 400"},"I = 12 × 400":{"fr":"I = 12 × 400","es":"I = 12 × 400"},"I = 400 ÷ 12":{"fr":"I = 400 ÷ 12","es":"I = 400 ÷ 12"},"I = U ÷ R = 12 ÷ 400 = «0,03 A» = 30 mA.":{"fr":"I = U ÷ R = 12 ÷ 400 = [[0,03 A]] = 30 mA.","es":"I = U ÷ R = 12 ÷ 400 = [[0,03 A]] = 30 mA."},"Vérification":{"fr":"Vérification","es":"Comprobación"},"Prévois : I = U ÷ R = ? mA":{"fr":"Prévois : I = U ÷ R = ? mA","es":"Prevé: I = U ÷ R = ? mA"},"Calcula 9 ÷ 470 y pásalo a mA (× 1000)":{"fr":"Calcule 9 ÷ 470 et convertis en mA (× 1000)","es":"Calcula 9 ÷ 470 y pásalo a mA (× 1000)"},"Vérifie avec l'ampèremètre (en série)":{"fr":"Vérifie avec l'ampèremètre (en série)","es":"Compruébalo con el amperímetro (en serie)"},"Colócalo en el hueco":{"fr":"Place-le dans le trou","es":"Colócalo en el hueco"},"La mesure confirme ta prévision":{"fr":"La mesure confirme ta prévision","es":"La medida confirma tu previsión"},"Compara la pantalla con tu cálculo":{"fr":"Compare l'écran avec ton calcul","es":"Compara la pantalla con tu cálculo"},"9 ÷ 470 = 0,019… A. Para pasar a mA, multiplica por 1000.":{"fr":"9 ÷ 470 = 0,019… A. Pour passer en mA, multiplie par 1000.","es":"9 ÷ 470 = 0,019… A. Para pasar a mA, multiplica por 1000."},"El hueco está arriba a la derecha.":{"fr":"Le trou est en haut à droite.","es":"El hueco está arriba a la derecha."},"Protéger la lampe":{"fr":"Protéger la lampe","es":"Proteger la lámpara"},"Tengo un problema: esta lámpara es de 6 V, pero mi generador da 12 V. Si la conecto directamente…":{"fr":"J'ai un problème : cette lampe est prévue pour 6 V, mais mon générateur donne 12 V. Si je la branche directement…","es":"Tengo un problema: esta lámpara es de 6 V, pero mi generador da 12 V. Si la conecto directamente…"},"¡Se fundiría! Con tu ley podemos salvarla: añadimos una resistencia en serie que se quede con los voltios que sobran.":{"fr":"Elle grillerait ! Avec votre loi, on peut la sauver : on ajoute une résistance en série qui prend les volts en trop.","es":"¡Se fundiría! Con su ley podemos salvarla: añadimos una resistencia en serie que se quede con los voltios que sobran."},"Lampe 6 V · 0,3 A, générateur 12 V. La résistance doit prendre 12 − 6 = 6 V avec I = 0,3 A. Calcule R.":{"fr":"Lampe 6 V · 0,3 A, générateur 12 V. La résistance doit prendre 12 − 6 = 6 V avec I = 0,3 A. Calcule R.","es":"Lámpara de 6 V · 0,3 A, generador de 12 V. La resistencia debe quedarse con 12 − 6 = 6 V, con I = 0,3 A. Calcula R."},"R = U ÷ I":{"fr":"R = U ÷ I","es":"R = U ÷ I"},"R = U × I":{"fr":"R = U × I","es":"R = U × I"},"R = I ÷ U":{"fr":"R = I ÷ U","es":"R = I ÷ U"},"R = 6 ÷ 0,3":{"fr":"R = 6 ÷ 0,3","es":"R = 6 ÷ 0,3"},"R = 12 ÷ 0,3":{"fr":"R = 12 ÷ 0,3","es":"R = 12 ÷ 0,3"},"R = 6 × 0,3":{"fr":"R = 6 × 0,3","es":"R = 6 × 0,3"},"R = U ÷ I = 6 ÷ 0,3 = «20 Ω». En la caja no hay 20 Ω: elegimos la más cercana, 22 Ω.":{"fr":"R = U ÷ I = 6 ÷ 0,3 = [[20 Ω]]. Il n'y a pas de 20 Ω dans la boîte : on choisit la plus proche, 22 Ω.","es":"R = U ÷ I = 6 ÷ 0,3 = [[20 Ω]]. En la caja no hay de 20 Ω: elegimos la más cercana, 22 Ω."},"Sauver la lampe":{"fr":"Sauver la lampe","es":"Salvar la lámpara"},"Ajoute une résistance en série dans le trou":{"fr":"Ajoute une résistance en série dans le trou","es":"Añade una resistencia en serie en el hueco"},"Coloca la resistencia abajo":{"fr":"Place la résistance en bas","es":"Coloca la resistencia abajo"},"L1 doit briller normalement":{"fr":"L1 doit briller normalement","es":"L1 debe brillar normalmente"},"Elige el valor de R adecuado":{"fr":"Choisis la bonne valeur de R","es":"Elige el valor de R adecuado"},"Coloca la resistencia en el hueco de abajo.":{"fr":"Place la résistance dans le trou du bas.","es":"Coloca la resistencia en el hueco de abajo."},"Con 47 Ω la lámpara brilla poco; con 10 Ω demasiado. ¿Cuál está en medio y se parece más a 20 Ω?":{"fr":"Avec 47 Ω, la lampe brille peu ; avec 10 Ω, trop. Laquelle est entre les deux et se rapproche le plus de 20 Ω ?","es":"Con 47 Ω la lámpara brilla poco; con 10 Ω demasiado. ¿Cuál está en medio y se parece más a 20 Ω?"},"Si se funde, selecciónala y pulsa «Remplacer».":{"fr":"Si elle grille, sélectionne-la et appuie sur « Remplacer ».","es":"Si se funde, selecciónala y pulsa «Reemplazar»."},"Le procès de Berlin":{"fr":"Le procès de Berlin","es":"El juicio de Berlín"},"Berlín, 1827. El ministerio de Educación de Prusia.":{"fr":"Berlin, 1827. Le ministère de l'Éducation de Prusse.","es":"Berlín, 1827. El ministerio de Educación de Prusia."},"Herr Ohm, nos han dicho que su libro está lleno de fantasías matemáticas.":{"fr":"Herr Ohm, on nous a dit que votre livre est rempli de fantaisies mathématiques.","es":"Herr Ohm, nos han dicho que su libro está lleno de fantasías matemáticas."},"¡Exacto, Excelencia! ¡La corriente depende del color del hilo y de la luna! ¡Su «ley» es un disparate!":{"fr":"Exactement, Excellence ! Le courant dépend de la couleur du fil et de la lune ! Sa « loi » est une absurdité !","es":"¡Exacto, Excelencia! ¡La corriente depende del color del hilo y de la luna! ¡Su «ley» es un disparate!"},"Puedo demostrarlo… pero el Barón ha preparado preguntas trampa.":{"fr":"Je peux le démontrer… mais le Baron a préparé des questions pièges.","es":"Puedo demostrarlo… pero el Barón ha preparado preguntas trampa."},"{N}, demuéstrale al ministro que la ley de Ohm funciona. Siete preguntas, tres vidas.":{"fr":"{N}, prouve au ministre que la loi d'Ohm fonctionne. Sept questions, trois vies.","es":"{N}, demuéstrale al ministro que la ley de Ohm funciona. Siete preguntas, tres vidas."},"Les questions du ministre":{"fr":"Les questions du ministre","es":"Las preguntas del ministro"},"Ohmio, Ω.":{"fr":"L'ohm, Ω.","es":"El ohmio, Ω."},"R = 100 Ω, I = 0,05 A. U = ? V":{"fr":"R = 100 Ω, I = 0,05 A. U = ? V","es":"R = 100 Ω, I = 0,05 A. U = ? V"},"U = R × I = 100 × 0,05 = 5 V.":{"fr":"U = R × I = 100 × 0,05 = 5 V.","es":"U = R × I = 100 × 0,05 = 5 V."},"U = 6 V, R = 200 Ω. I = ? A":{"fr":"U = 6 V, R = 200 Ω. I = ? A","es":"U = 6 V, R = 200 Ω. I = ? A"},"I = U ÷ R = 6 ÷ 200 = 0,03 A.":{"fr":"I = U ÷ R = 6 ÷ 200 = 0,03 A.","es":"I = U ÷ R = 6 ÷ 200 = 0,03 A."},"U = 4,5 V, I = 0,15 A. R = ? Ω":{"fr":"U = 4,5 V, I = 0,15 A. R = ? Ω","es":"U = 4,5 V, I = 0,15 A. R = ? Ω"},"R = U ÷ I = 4,5 ÷ 0,15 = 30 Ω.":{"fr":"R = U ÷ I = 4,5 ÷ 0,15 = 30 Ω.","es":"R = U ÷ I = 4,5 ÷ 0,15 = 30 Ω."},"La caractéristique d'un conducteur ohmique est…":{"fr":"La caractéristique d'un conducteur ohmique est…","es":"La característica de un conductor óhmico es…"},"une droite passant par l'origine":{"fr":"une droite passant par l'origine","es":"una recta que pasa por el origen"},"une courbe en U":{"fr":"une courbe en U","es":"una curva en U"},"une parabole":{"fr":"une parabole","es":"una parábola"},"Recta que pasa por el origen: U e I son proporcionales.":{"fr":"Une droite qui passe par l'origine : U et I sont proportionnelles.","es":"Recta que pasa por el origen: U e I son proporcionales."},"marron · noir · rouge =":{"fr":"marron · noir · rouge =","es":"marrón · negro · rojo ="},"1 000 Ω":{"fr":"1 000 Ω","es":"1000 Ω"},"102 Ω":{"fr":"102 Ω","es":"102 Ω"},"120 Ω":{"fr":"120 Ω","es":"120 Ω"},"10 Ω":{"fr":"10 Ω","es":"10 Ω"},"1, 0 y dos ceros: 1000 Ω.":{"fr":"1, 0 et deux zéros : 1 000 Ω.","es":"1, 0 y dos ceros: 1000 Ω."},"U ne change pas. Si R est multipliée par 2, I est…":{"fr":"U ne change pas. Si R est multipliée par 2, I est…","es":"U no cambia. Si R se multiplica por 2, I queda…"},"divisée par 2":{"fr":"divisée par 2","es":"dividida entre 2"},"multipliée par 2":{"fr":"multipliée par 2","es":"multiplicada por 2"},"inchangée":{"fr":"inchangée","es":"igual"},"nulle":{"fr":"nulle","es":"nula"},"I = U ÷ R: si R se duplica, I se divide entre 2.":{"fr":"I = U ÷ R : si R double, I est divisée par 2.","es":"I = U ÷ R: si R se duplica, I se divide entre 2."},"Impresionante. Herr Ohm, sus números no mienten.":{"fr":"Impressionnant. Herr Ohm, vos chiffres ne mentent pas.","es":"Impresionante. Herr Ohm, sus números no mienten."},"¡NOOO! ¡Mi plan perfecto! Muy bien… ¡me voy a Inglaterra! ¡Allí un cervecero está jugando con el calor y la electricidad!":{"fr":"NOOON ! Mon plan parfait ! Très bien… je pars en Angleterre ! Là-bas, un brasseur s'amuse avec la chaleur et l'électricité !","es":"¡NOOO! ¡Mi plan perfecto! Muy bien… ¡me voy a Inglaterra! ¡Allí un cervecero está jugando con el calor y la electricidad!"},"Danke, meine Freunde. Al principio nadie me creerá, lo sé. Pero en 1841 la Royal Society me dará la medalla Copley. Ahora tengo paciencia.":{"fr":"Danke, meine Freunde. Au début, personne ne me croira, je le sais. Mais en 1841, la Royal Society me remettra la médaille Copley. Maintenant, je suis patient.","es":"Danke, meine Freunde. Al principio nadie me creerá, lo sé. Pero en 1841 la Royal Society me dará la medalla Copley. Ahora tengo paciencia."},"¡Página 2 recuperada! Próxima parada: Mánchester, 1843… cuando el Chronotron termine de recargarse.":{"fr":"Page 2 récupérée ! Prochain arrêt : Manchester, 1843… dès que le Chronotron aura fini de se recharger.","es":"¡Página 2 recuperada! Próxima parada: Mánchester, 1843… cuando el Chronotron termine de recargarse."},"Manchester":{"fr":"Manchester","es":"Mánchester"},"Mánchester, 1843":{"fr":"Manchester, 1843","es":"Mánchester, 1843"},"La puissance":{"fr":"La puissance","es":"La potencia"},"Potencia, energía y efecto Joule":{"fr":"Puissance, énergie et effet Joule","es":"Potencia, energía y efecto Joule"},"New York":{"fr":"New York","es":"Nueva York"},"Nueva York, 1884":{"fr":"New York, 1884","es":"Nueva York, 1884"},"La sécurité":{"fr":"La sécurité","es":"La seguridad"},"Edison, Tesla, fusibles y cortocircuitos":{"fr":"Edison, Tesla, fusibles et courts-circuits","es":"Edison, Tesla, fusibles y cortocircuitos"},"Le Vortex":{"fr":"Le Vortex","es":"El Vórtice"},"Fuera del tiempo":{"fr":"Hors du temps","es":"Fuera del tiempo"},"Le Baron":{"fr":"Le Baron","es":"El Barón"},"El duelo final":{"fr":"Le duel final","es":"El duelo final"},"Un circuit doit être fermé":{"fr":"Un circuit doit être fermé","es":"El circuito debe estar cerrado"},"Le courant ne circule que si la boucle est **fermée** : du générateur, à travers les dipôles, et retour au générateur. Un seul trou et tout s'arrête.":{"fr":"Le courant ne circule que si la boucle est **fermée** : du générateur, à travers les dipôles, et retour au générateur. Un seul trou et tout s'arrête.","es":"La corriente solo circula si el bucle está **cerrado**: desde el generador, a través de los dipolos, y de vuelta al generador. Un solo hueco y todo se para."},"La corriente solo circula si el camino forma un bucle cerrado. Un solo hueco y todo se apaga.":{"fr":"Pense à un circuit de petites voitures : s'il manque un morceau de piste, plus rien ne roule.","es":"Piensa en un circuito de coches de juguete: si falta un trozo de pista, nada se mueve."},"Le sens conventionnel du courant":{"fr":"Le sens conventionnel du courant","es":"El sentido convencional de la corriente"},"À l'extérieur du générateur, le courant va de la borne **+** vers la borne **−**. Dans le labo, les petits points lumineux suivent ce sens.":{"fr":"À l'extérieur du générateur, le courant va de la borne **+** vers la borne **−**. Dans le labo, les petits points lumineux suivent ce sens.","es":"Fuera del generador, la corriente va del borne **+** al borne **−**. En el laboratorio, los puntitos luminosos siguen ese sentido."},"Fuera de la pila, la corriente va del + al −. Los puntitos luminosos del laboratorio siguen ese sentido.":{"fr":"Astuce : « le courant sort par le plus ». Sur le symbole de la pile, le + est le grand trait.","es":"Truco: «la corriente sale por el más». En el símbolo de la pila, el + es la raya larga."},"L'intensité du courant":{"fr":"L'intensité du courant","es":"La intensidad de la corriente"},"On la note **I**. Son unité est l'**ampère (A)**. On utilise souvent le **milliampère** : **1 A = 1000 mA**, donc 0,25 A = 250 mA.":{"fr":"On la note **I**. Son unité est l'**ampère (A)**. On utilise souvent le **milliampère** : **1 A = 1000 mA**, donc 0,25 A = 250 mA.","es":"Se representa con la letra **I**. Su unidad es el **amperio (A)**. A menudo se usa el **miliamperio**: **1 A = 1000 mA**, así que 0,25 A = 250 mA."},"Se escribe I y se mide en amperios (A). 1 A = 1000 mA. Truco: para pasar de A a mA, la coma salta 3 cifras a la derecha.":{"fr":"Astuce : pour passer de A en mA, la virgule saute de 3 chiffres vers la droite.","es":"Truco: para pasar de A a mA, la coma salta 3 cifras a la derecha."},"Brancher l'ampèremètre":{"fr":"Brancher l'ampèremètre","es":"Conectar el amperímetro"},"L'ampèremètre se branche **en série**, dans la boucle. Le courant entre par la borne **A** (ou **mA**) et sort par la borne **COM**. Si l'écran affiche un signe −, on inverse les fils.":{"fr":"L'ampèremètre se branche **en série**, dans la boucle. Le courant entre par la borne **A** (ou **mA**) et sort par la borne **COM**. Si l'écran affiche un signe −, on inverse les fils.","es":"El amperímetro se conecta **en serie**, dentro del bucle. La corriente entra por el borne **A** (o **mA**) y sale por el borne **COM**. Si la pantalla muestra un signo −, se invierten los cables."},"El amperímetro va en serie: hay que abrir el circuito y meterlo dentro. Entra por A (o mA) y sale por COM.":{"fr":"Pour le brancher, il faut ouvrir le circuit et placer l'ampèremètre dedans, comme un maillon de plus dans une chaîne.","es":"Para conectarlo hay que abrir el circuito y meter el amperímetro dentro, como un eslabón más de la cadena."},"Le piège du Barón":{"fr":"Le piège du Baron","es":"La trampa del Barón"},"Un ampèremètre n'a presque **pas de résistance**. Branché en **dérivation**, il crée un **court-circuit** : un courant énorme le traverse et son fusible fond.":{"fr":"Un ampèremètre n'a presque **pas de résistance**. Branché en **dérivation**, il crée un **court-circuit** : un courant énorme le traverse et son fusible fond.","es":"Un amperímetro casi **no tiene resistencia**. Conectado **en paralelo**, provoca un **cortocircuito**: una corriente enorme lo atraviesa y se funde su fusible."},"El amperímetro casi no tiene resistencia. En derivación provoca un cortocircuito y se funde su fusible. ¡Nunca en derivación!":{"fr":"Retiens : un ampèremètre, jamais en dérivation ! Toujours en série.","es":"Recuerda: un amperímetro, ¡nunca en paralelo! Siempre en serie."},"Loi d'unicité de l'intensité":{"fr":"Loi d'unicité de l'intensité","es":"Ley de unicidad de la intensidad"},"**Dans un circuit en série, l'intensité du courant est la même en tout point.** I = I1 = I2 = I3. Le courant ne « s'use » pas en traversant une lampe !":{"fr":"**Dans un circuit en série, l'intensité du courant est la même en tout point.** I = I1 = I2 = I3. Le courant ne « s'use » pas en traversant une lampe !","es":"**En un circuito en serie, la intensidad de la corriente es la misma en todos los puntos.** I = I1 = I2 = I3. ¡La corriente no se «gasta» al atravesar una lámpara!"},"En serie la intensidad es igual en todos los puntos. La lámpara no gasta corriente: la corriente circula, como el agua en un circuito cerrado.":{"fr":"La lampe ne consomme pas le courant : le courant circule, comme l'eau dans un circuit fermé.","es":"En serie la intensidad es igual en todos los puntos. La lámpara no gasta corriente: la corriente circula, como el agua en un circuito cerrado."},"Loi d'additivité des intensités":{"fr":"Loi d'additivité des intensités","es":"Ley de adición de intensidades"},"**Dans un circuit en dérivation, l'intensité dans la branche principale est égale à la somme des intensités dans les branches dérivées.** I = I1 + I2. Ce qui arrive à un nœud en repart.":{"fr":"**Dans un circuit en dérivation, l'intensité dans la branche principale est égale à la somme des intensités dans les branches dérivées.** I = I1 + I2. Ce qui arrive à un nœud en repart.","es":"**En un circuito en paralelo, la intensidad en la rama principal es igual a la suma de las intensidades en las ramas derivadas.** I = I1 + I2. Todo lo que llega a un nudo vuelve a salir."},"En derivación, la corriente se reparte: I = I1 + I2. Todo lo que entra en un nudo, sale.":{"fr":"En dérivation, le courant se partage : I = I1 + I2. Tout ce qui entre dans un nœud en ressort.","es":"En paralelo, la corriente se reparte: I = I1 + I2. Todo lo que entra en un nudo, sale."},"L'image de l'eau":{"fr":"L'image de l'eau","es":"La imagen del agua"},"Imagine le courant comme de l'eau dans des tuyaux : le générateur est une pompe, l'intensité est le débit, les résistances sont des tuyaux étroits.":{"fr":"Imagine le courant comme de l'eau dans des tuyaux : le générateur est une pompe, l'intensité est le débit, les résistances sont des tuyaux étroits.","es":"Imagina la corriente como agua en tuberías: el generador es una bomba, la intensidad es el caudal y las resistencias son tuberías estrechas."},"La pila es una bomba de agua, la intensidad es el caudal y las resistencias son tuberías estrechas que frenan el agua.":{"fr":"Les résistances sont comme des tuyaux étroits : elles freinent l'eau. Plus le tuyau est étroit, plus le débit est faible.","es":"Las resistencias son como tuberías estrechas: frenan el agua. Cuanto más estrecha la tubería, menor el caudal."},"Une résistance **s'oppose au passage du courant**. Son unité est l'**ohm (Ω)**. En série, plus R est grande, plus l'intensité I est petite.":{"fr":"Une résistance **s'oppose au passage du courant**. Son unité est l'**ohm (Ω)**. En série, plus R est grande, plus l'intensité I est petite.","es":"Una resistencia **se opone al paso de la corriente**. Su unidad es el **ohmio (Ω)**. En serie, cuanto mayor es R, menor es la intensidad I."},"Una resistencia frena la corriente. Se mide en ohmios (Ω). Más resistencia = menos intensidad.":{"fr":"Une résistance freine le courant. Elle se mesure en ohms (Ω). Plus de résistance = moins d'intensité.","es":"Una resistencia frena la corriente. Se mide en ohmios (Ω). Más resistencia = menos intensidad."},"1ʳᵉ bague = 1ᵉʳ chiffre, 2ᵉ bague = 2ᵉ chiffre, 3ᵉ bague = nombre de zéros. noir 0 · marron 1 · rouge 2 · orange 3 · jaune 4 · vert 5 · bleu 6 · violet 7 · gris 8 · blanc 9. Ex. : marron-noir-rouge = 1 0 00 = 1000 Ω.":{"fr":"1ʳᵉ bague = 1ᵉʳ chiffre, 2ᵉ bague = 2ᵉ chiffre, 3ᵉ bague = nombre de zéros. noir 0 · marron 1 · rouge 2 · orange 3 · jaune 4 · vert 5 · bleu 6 · violet 7 · gris 8 · blanc 9. Ex. : marron-noir-rouge = 1 0 00 = 1 000 Ω.","es":"1.ª banda = 1.ª cifra, 2.ª banda = 2.ª cifra, 3.ª banda = número de ceros. negro 0 · marrón 1 · rojo 2 · naranja 3 · amarillo 4 · verde 5 · azul 6 · violeta 7 · gris 8 · blanco 9. Ej.: marrón-negro-rojo = 1 0 00 = 1000 Ω."},"Truco para recordarlo: «Ni Mi Rojo Oso Ama Ver Bailar Violines Grises Blancos» (negro, marrón, rojo, naranja, amarillo, verde, azul, violeta, gris, blanco).":{"fr":"Pour retenir l'ordre : « **N**e **M**angez **R**ien **O**u **J**e **V**ous **B**rûle **V**otre **G**rande **B**arbe » (noir, marron, rouge, orange, jaune, vert, bleu, violet, gris, blanc).","es":"Para recordar el orden: «**N**unca **M**e **R**ompas **N**ada, **A**sí **V**amos **A** **V**er **G**ente **B**uena» (negro, marrón, rojo, naranja, amarillo, verde, azul, violeta, gris, blanco)."},"La caractéristique d'un conducteur ohmique":{"fr":"La caractéristique d'un conducteur ohmique","es":"La característica de un conductor óhmico"},"On trace U en fonction de I. Pour un **conducteur ohmique**, on obtient une **droite qui passe par l'origine** : U et I sont **proportionnelles**.":{"fr":"On trace U en fonction de I. Pour un **conducteur ohmique**, on obtient une **droite qui passe par l'origine** : U et I sont **proportionnelles**.","es":"Se dibuja U en función de I. Para un **conductor óhmico**, se obtiene una **recta que pasa por el origen**: U e I son **proporcionales**."},"Si dibujas U frente a I y sale una recta que pasa por el origen, es un conductor óhmico.":{"fr":"Si tu traces U en fonction de I et que tu obtiens une droite qui passe par l'origine, c'est un conducteur ohmique.","es":"Si dibujas U frente a I y sale una recta que pasa por el origen, es un conductor óhmico."},"Loi d'Ohm":{"fr":"Loi d'Ohm","es":"Ley de Ohm"},"**La tension U aux bornes d'un conducteur ohmique est égale au produit de sa résistance R par l'intensité I du courant qui le traverse : U = R × I** (U en V, R en Ω, I en A). Donc aussi I = U ÷ R et R = U ÷ I.":{"fr":"**La tension U aux bornes d'un conducteur ohmique est égale au produit de sa résistance R par l'intensité I du courant qui le traverse : U = R × I** (U en V, R en Ω, I en A). Donc aussi I = U ÷ R et R = U ÷ I.","es":"**La tensión U entre los bornes de un conductor óhmico es igual al producto de su resistencia R por la intensidad I de la corriente que lo atraviesa: U = R × I** (U en V, R en Ω, I en A). Por tanto, también I = U ÷ R y R = U ÷ I."},"U = R × I. Truco del triángulo: escribe U arriba y R · I abajo. Tapa la letra que buscas y lo que queda te da la fórmula.":{"fr":"Astuce du triangle : écris U en haut et R · I en bas. Cache la lettre que tu cherches : ce qui reste te donne la formule.","es":"U = R × I. Truco del triángulo: escribe U arriba y R · I abajo. Tapa la letra que buscas y lo que queda te da la fórmula."},"Le triangle magique":{"fr":"Le triangle magique","es":"El triángulo mágico"},"U en haut, R et I en bas. Cache ce que tu cherches : U = R × I, I = U ÷ R, R = U ÷ I. **Attention : I toujours en ampères !** 20 mA = 0,020 A.":{"fr":"U en haut, R et I en bas. Cache ce que tu cherches : U = R × I, I = U ÷ R, R = U ÷ I. **Attention : I toujours en ampères !** 20 mA = 0,020 A.","es":"U arriba, R e I abajo. Tapa lo que buscas: U = R × I, I = U ÷ R, R = U ÷ I. **¡Cuidado: I siempre en amperios!** 20 mA = 0,020 A."},"¡Ojo! En la fórmula, I siempre en amperios. Si te dan mA, divide entre 1000 antes de calcular.":{"fr":"Attention ! Dans la formule, I est toujours en ampères. Si on te donne des mA, divise par 1000 avant de calculer.","es":"¡Ojo! En la fórmula, I siempre en amperios. Si te dan mA, divide entre 1000 antes de calcular."},"Protéger une lampe":{"fr":"Protéger une lampe","es":"Proteger una lámpara"},"Si le générateur donne plus que la tension nominale, on ajoute une résistance en série. Elle « prend » la tension en trop : R = (U − Un) ÷ In.":{"fr":"Si le générateur donne plus que la tension nominale, on ajoute une résistance en série. Elle « prend » la tension en trop : R = (U − Un) ÷ In.","es":"Si el generador da más que la tensión nominal, se añade una resistencia en serie. Se «queda» con la tensión que sobra: R = (U − Un) ÷ In."},"La resistencia en serie se queda con los voltios que sobran.":{"fr":"La résistance en série prend les volts en trop.","es":"La resistencia en serie se queda con los voltios que sobran."},"André-Marie Ampère (1775-1836)":{"fr":"André-Marie Ampère (1775-1836)","es":"André-Marie Ampère (1775-1836)"},"En septembre 1820, une semaine après avoir appris l'expérience d'Ørsted (un courant fait bouger une boussole), Ampère présente à l'Académie des sciences ses découvertes sur les courants. C'est lui qui popularise les mots « courant électrique » et « tension ».":{"fr":"En septembre 1820, une semaine après avoir appris l'expérience d'Ørsted (un courant fait bouger une boussole), Ampère présente à l'Académie des sciences ses découvertes sur les courants. C'est lui qui popularise les mots « courant électrique » et « tension ».","es":"En septiembre de 1820, una semana después de conocer el experimento de Ørsted (una corriente mueve una brújula), Ampère presenta en la Académie des sciences sus descubrimientos sobre las corrientes. Fue él quien popularizó las expresiones «corriente eléctrica» y «tensión»."},"Era famoso por despistado: se cuenta que una vez escribió ecuaciones en la parte trasera de un coche de caballos… que se fue con sus cálculos. El amperio lleva su nombre desde 1881.":{"fr":"Il était célèbre pour ses distractions : on raconte qu'un jour, il a écrit des équations au dos d'un fiacre… qui est reparti avec ses calculs. L'ampère porte son nom depuis 1881.","es":"Era famoso por despistado: se cuenta que una vez escribió ecuaciones en la parte trasera de un coche de caballos… que se fue con sus cálculos. El amperio lleva su nombre desde 1881."},"Georg Simon Ohm (1789-1854)":{"fr":"Georg Simon Ohm (1789-1854)","es":"Georg Simon Ohm (1789-1854)"},"Professeur au lycée des jésuites de Cologne, Ohm publie en 1827 « Die galvanische Kette ». Ses idées sont d'abord moquées et il perd son poste. Quatorze ans plus tard, la Royal Society de Londres lui remet la médaille Copley.":{"fr":"Professeur au lycée des jésuites de Cologne, Ohm publie en 1827 « Die galvanische Kette ». Ses idées sont d'abord mal accueillies et il quitte son poste. Quatorze ans plus tard, la Royal Society de Londres lui remet la médaille Copley.","es":"Profesor en el colegio de los jesuitas de Colonia, Ohm publica en 1827 «Die galvanische Kette». Al principio sus ideas son mal recibidas y deja su puesto. Catorce años después, la Royal Society de Londres le entrega la medalla Copley."},"Para tener medidas estables, Ohm cambió las pilas (que se agotaban) por un termopar: dos metales soldados, uno en agua hirviendo y otro en hielo. ¡Ingenioso!":{"fr":"Pour avoir des mesures stables, Ohm a remplacé les piles (qui s'épuisaient) par un thermocouple : deux métaux soudés, l'un dans l'eau bouillante et l'autre dans la glace. Ingénieux !","es":"Para tener medidas estables, Ohm cambió las pilas (que se agotaban) por un termopar: dos metales soldados, uno en agua hirviendo y otro en hielo. ¡Ingenioso!"},"1881 : les unités officielles":{"fr":"1881 : les unités officielles","es":"1881: las unidades oficiales"},"Au Congrès international des électriciens de Paris (1881), les savants adoptent officiellement le volt, l'ampère et l'ohm, en l'honneur de Volta, Ampère et Ohm.":{"fr":"Au Congrès international des électriciens de Paris (1881), les savants adoptent officiellement le volt, l'ampère et l'ohm, en l'honneur de Volta, Ampère et Ohm.","es":"En el Congreso Internacional de Electricistas de París (1881), los científicos adoptan oficialmente el voltio, el amperio y el ohmio, en honor de Volta, Ampère y Ohm."},"Por eso decimos voltios, amperios y ohmios.":{"fr":"C'est pour ça qu'on dit volts, ampères et ohms.","es":"Por eso decimos voltios, amperios y ohmios."},"L'intensité du courant : unité ampère (A), 1 A = 1000 mA":{"fr":"L'intensité du courant : unité ampère (A), 1 A = 1000 mA","es":"La intensidad de la corriente: unidad amperio (A), 1 A = 1000 mA"},"La intensidad: amperios y miliamperios":{"fr":"L'intensité : ampères et milliampères","es":"La intensidad: amperios y miliamperios"},"Brancher un ampèremètre en série (bornes A ou mA et COM)":{"fr":"Brancher un ampèremètre en série (bornes A ou mA et COM)","es":"Conectar un amperímetro en serie (bornes A o mA y COM)"},"Conectar el amperímetro en serie":{"fr":"Brancher l'ampèremètre en série","es":"Conectar el amperímetro en serie"},"Loi d'unicité de l'intensité dans un circuit en série":{"fr":"Loi d'unicité de l'intensité dans un circuit en série","es":"Ley de unicidad de la intensidad en un circuito en serie"},"Ley de unicidad de la intensidad en serie":{"fr":"Loi d'unicité de l'intensité en série","es":"Ley de unicidad de la intensidad en serie"},"Loi d'additivité des intensités (loi des nœuds)":{"fr":"Loi d'additivité des intensités (loi des nœuds)","es":"Ley de adición de intensidades (ley de los nudos)"},"Ley de los nudos en derivación":{"fr":"Loi des nœuds en dérivation","es":"Ley
